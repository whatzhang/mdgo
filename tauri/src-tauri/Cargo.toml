[workspace]
resolver = "2"
members = [
    ".",
    "core",
]

[package]
name = "mdgo"
version = "1.0.0"
description = "mdgo"
authors = ["whatzhang"]
edition = "2024"

[lib]
name = "mdgo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
sysinfo = "0.39.5"
arboard = "3"
tokio = { version = "1", features = ["full"] }

# AI 聊天历史
rusqlite = { version = "0.34", features = ["bundled"] }

# 知识库 — 核心引擎（重型依赖隔离在 mdgo-core 中）
mdgo-core = { path = "core" }

# 工具
uuid = { version = "1", features = ["v4"] }
regex = "1"

# 日志
log = "0.4"
simplelog = "0.12"
