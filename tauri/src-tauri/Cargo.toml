[package]
name = "mdgo"
version = "1.0.0"
description = "mdgo"
authors = ["whatzhang"]
edition = "2024"

[lib]
name = "mdgo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
