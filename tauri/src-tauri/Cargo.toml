[package]
name = "mdgo"
version = "1.0.0"
description = "mdgo"
authors = ["whatzhang"]
edition = "2024"

[lib]
name = "mdgo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["pdf-extract"]
pdf-extract = ["dep:pdf-extract"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
sysinfo = "0.39.5"
arboard = "3"
tokio = { version = "1", features = ["full"] }

# AI 聊天历史
rusqlite = { version = "0.34", features = ["bundled"] }

# 工具
uuid = { version = "1", features = ["v4"] }
regex = "1"

# XML 解析（OPML）
roxmltree = "0.20"

# LLM 客户端 + 异步工具
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"

# 日志
log = "0.4"
simplelog = "0.12"

# ─── 知识库核心引擎依赖 ───
# 向量数据库
lancedb = "0.31"
arrow-array = "58"
arrow-schema = "58"
# 全文索引
tantivy = "0.26"
# 数值计算
ndarray = "0.17"
rayon = "1.10"
# 中文分词（Jieba，替换简单 Bigram）
jieba-rs = "0.10"
# 分词
tokenizers = "0.22"
# 文件监听
notify = { version = "8", features = ["macos_kqueue"] }
# PDF 提取
pdf-extract = { version = "0.7", optional = true }

# ─── ONNX Runtime / 推理引擎 按平台选择 ───
# Windows：原生 ONNX Runtime + DirectML GPU
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "directml"] }

# macOS Apple Silicon：原生 ONNX Runtime + CoreML GPU
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "coreml"] }

# Intel Mac / Linux：tract-onnx 直接使用
[target.'cfg(not(any(target_os = "windows", all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
tract-onnx = "0.23"
