[package]
name = "mdgo"
version = "1.0.0"
description = "mdgo"
authors = ["whatzhang"]
edition = "2024"
default-run = "mdgo" 

[lib]
name = "mdgo_lib"
crate-type = ["lib", "cdylib"]

[features]
default = ["pdf-extract"]
pdf-extract = ["dep:pdf-extract"]
# 🟠 L31：检索基准（benchmark bin 依赖 core 公开面；默认构建不启用，控制 API 暴露面）
bench = []

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["bench"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
sysinfo = "0.39.5"
arboard = "3"
tokio = { version = "1", features = ["full"] }

# AI 聊天历史
rusqlite = { version = "0.34", features = ["bundled"] }

# 工具
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
regex = "1"
# Markdown AST 解析（结构识别，替代正则状态机）
comrak = { version = "0.54", default-features = false }

# HTML 解析与文本提取（P2：webfetch / HTML chunk）
scraper = "0.20"
ammonia = "4"
# 正文提取（readability-rs 的 Mozilla Readability 移植）与 HTML→Markdown（htmd）
readability = "0.3"
htmd = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"

# YAML 解析（Skill 元数据 SKILL.md frontmatter）
serde_yaml = "0.9"

# XML 解析（OPML）
roxmltree = "0.20"

# LLM 客户端 + 异步工具
reqwest = { version = "0.12", features = ["stream", "json", "blocking"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"
# HTTP 状态码类型（LLM 重试判定使用）
http = "1"
# JSON Schema 校验（P0-3 结构化输出；本地校验，禁用网络引用解析相关 features）
jsonschema = { version = "0.49", default-features = false }

# 日志
log = "0.4"
simplelog = "0.12"
# 可观测性:捕获 LLM 内部 tracing span;tracing-log 桥接现有 log:: 宏
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-log = "0.2"
# 日期时间格式化（垃圾箱目录命名）
chrono = "0.4"
# 日程引擎：Cron 表达式解析与迭代（现成框架，5 字段补秒适配）
cron = "0.13"
# 日程引擎：农历计算（现成框架，替代前端 lunar.min.js）
chinese-lunisolar-calendar = "0.2"
# 全局用户数据目录（日程节假日缓存）
dirs = "6"

# ─── 知识库核心引擎依赖 ───
# 向量数据库
lancedb = "0.31"
arrow-array = "58"
arrow-schema = "58"
# 全文索引
tantivy = "0.26"
# 数值计算
ndarray = "0.17"
rayon = "1.10"
# 中文分词（Jieba，替换简单 Bigram）
jieba-rs = "0.10"
# 分词
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
# 文件监听
notify = { version = "8", features = ["macos_kqueue"] }
# PDF 提取
pdf-extract = { version = "0.7", optional = true }
async-trait = "0.1"
# JSON Schema 结构化输出（CompletionRequest.output_schema 类型）
schemars = "1"
anyhow = "1.0.104"

# ─── ONNX Runtime / 推理引擎 按平台选择 ───
# Windows：原生 ONNX Runtime + DirectML GPU
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "directml"] }
# Windows 注册表读取（GPU 静态信息：名称/显存，替代 PowerShell 子进程）
winreg = "0.55"
# Windows 性能计数器 PDH（GPU 使用率/显存采集，进程内，替代 PowerShell 子进程）
windows-sys = { version = "0.61.2", features = ["Win32_System_Performance", "Win32_Foundation"] }

# macOS Apple Silicon：原生 ONNX Runtime + CoreML GPU
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "coreml"] }

# Intel Mac / Linux：tract-onnx 直接使用
[target.'cfg(not(any(target_os = "windows", all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
tract-onnx = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true          # 剥离符号/调试信息（PDB/dSYM 本就不随包分发）
panic = "abort"       # 移除 unwinding 运行时，再省几 MB（Tauri 兼容）

# ============== 开发 / 测试 加速 ==============
# 目标：明显缩短 cargo build / cargo test / cargo run 的时间。
# - opt-level=1：保留可断点；重编/测试运行都比 opt-level=0 快很多
# - debug="line-tables-only"：跳过完整 debug 符号生成，链接阶段显著加速
# - codegen-units=256：增强模块内并行
# - incremental：默认 true，显式声明意图
# 第三方 crate 也走 opt-level=1（dev-deps 同理），温重编收益最大
[profile.dev]
opt-level = 1
debug = "line-tables-only"
codegen-units = 256
incremental = true
# Windows MSVC：unpacked 让链接器不处理调试信息（加速链接，符号文件独立生成）；
# 配合 debug="line-tables-only" 显著缩短「改一行→可运行」的链接时间
split-debuginfo = "unpacked"

# 第三方 crate：不生成调试符号（依赖无需断点），显著加速链接与增量重编；
# 仍保留 opt-level=1 保证依赖运行速度（测试/索引性能不受损）
[profile.dev.package."*"]
opt-level = 1
debug = false

# 单测同样走 opt-level=1 + line-tables-only：测试运行快 3-5x，断点仍可用；
# 依赖侧 debug=false 加速测试二进制链接（测试编译慢的主因之一）
[profile.test]
opt-level = 1
debug = "line-tables-only"
codegen-units = 256
split-debuginfo = "unpacked"

[profile.test.package."*"]
opt-level = 1
debug = false
