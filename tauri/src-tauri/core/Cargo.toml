[package]
name = "mdgo-core"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# 重型依赖
lancedb = "0.31"
arrow-array = "58"
arrow-schema = "58"
tantivy = "0.26"
# 基础依赖：ndarray 始终需要
ndarray = "0.17"
tokenizers = "0.22"
notify = { version = "8", features = ["macos_kqueue"] }
walkdir = "2"

# ─── ONNX Runtime / 推理引擎 按平台选择 ───
#
# 策略：
#   - Windows → 原生 ONNX Runtime + DirectML GPU
#   - macOS aarch64 (M系列) → 原生 ONNX Runtime + CoreML GPU
#   - macOS x86_64 (Intel) / Linux → tract-onnx 直接使用（纯 Rust，零原生依赖）

# Windows：原生 ONNX Runtime + DirectML GPU
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "directml"] }

# macOS Apple Silicon：原生 ONNX Runtime + CoreML GPU
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["ndarray", "coreml"] }

# Intel Mac / Linux：tract-onnx 直接使用（不经过 ort-tract 包装层）
[target.'cfg(not(any(target_os = "windows", all(target_os = "macos", target_arch = "aarch64"))))'.dependencies]
tract-onnx = "0.23"

[build-dependencies]