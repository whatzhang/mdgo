[package]
name = "mdgo-core"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# 重型依赖
lancedb = "0.31"
arrow-array = "58"
arrow-schema = "58"
tantivy = "0.26"
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }
ndarray = "0.17"
tokenizers = "0.22"
notify = { version = "8", features = ["macos_kqueue"] }
walkdir = "2"

# 平台特定 GPU 执行提供者
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.11", features = ["coreml"] }

[build-dependencies]