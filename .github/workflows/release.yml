name: Build & Release

# ============================================================
# 触发器：什么时候自动运行
# ============================================================
on:
  # ── 方式一：推送 v* 标签时自动构建并发布 ──
  #    例如：git tag v1.0.0 && git push origin v1.0.0
  push:
    tags:
      - 'v*'

  # ── 方式二：在 GitHub 网页发布 Release 时触发 ──
  release:
    types: [published]

# ============================================================
# 权限：让 workflow 能创建 Release
# ============================================================
permissions:
  contents: write

# ============================================================
# 并发控制：同一 tag 触发的多个 run 只保留一个
# 避免（push tag + release 事件双触发时）重复上传同名安装包冲突
# ============================================================
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# 任务
# ============================================================
jobs:
  # ──────────────────────────────────────────────────────────
  # 子任务：构建应用（Windows x64 + macOS ARM64 + macOS Intel）
  # ──────────────────────────────────────────────────────────
  build:
    strategy:
      # 让三个平台独立构建，避免任一平台失败时取消其他平台
      fail-fast: false
      matrix:
        include:
          # ── Windows x64（NSIS 安装包） ──
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_name: mdgo-windows-x64

          # ── macOS Apple Silicon（M1/M2/M3/M4，.dmg） ──
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_name: mdgo-macos-arm64

          # ── macOS Intel（.dmg） ──
          # 注意：macos-13 是 GitHub 最后一个 Intel macOS runner
          # 若 GitHub 废弃此 runner，需迁移到其他方案或仅保留 ARM64 构建
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   bundle_name: mdgo-macos-intel

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. 拉取你的代码 ──
      - name: 拉取代码
        uses: actions/checkout@v4

      # ── 2. 安装 Node.js（前端构建需要） ──
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # 使用 LTS 版本，避免版本弃用警告
          node-version: lts/*
          # 使用 package-lock.json 加速安装
          cache: 'npm'
          cache-dependency-path: tauri/package-lock.json

      # ── 3. 安装 Rust 工具链 ──
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ── 4. 安装 Rust 缓存（下次构建只需编译改动的代码，大幅提速） ──
      - name: 启用 Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          # Tauri 的 src-tauri 目录在 tauri/ 下面
          workspaces: tauri/src-tauri

      # ── 5. 安装 protoc（lancedb/arrow 依赖需要） ──
      - name: 安装 protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. 安装前端依赖 ──
      - name: 安装前端依赖
        run: npm ci
        working-directory: tauri

      # ── 7. 构建 Tauri 桌面应用 ──
      #    此步骤会自动：先执行 vite build（前端），再执行 cargo build --release（后端）
      #    最终生成安装包（Windows: .exe / macOS: .dmg）
      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 指定 Tauri 项目目录（包含 tauri.conf.json 的目录）
          projectPath: tauri
          # 构建参数：指定目标架构
          args: --target ${{ matrix.target }}
          # 上传目标 tag：push tag / release 事件时，ref_name 均等于对应 tag 名
          # tauri-action 会找到该 tag 的 Release 并上传安装包；若不存在则自动创建
          tagName: ${{ github.ref_name }}
          # tag 推送且 Release 不存在时，用这个名字创建 Release
          releaseName: ${{ github.ref_name }}
          releaseBody: 'Mdgo ${{ github.ref_name }} 发布版本，安装包见下方 Assets 区。'
          releaseDraft: false
          prerelease: false

      # ── 8. 上传构建产物 ──
      #    无论是否为 Release，都会作为 Actions 的 Artifact 保存
      #    注意：使用 --target 构建时，产物在 target/<target>/release/bundle/ 下
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle_name }}
          path: |
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            tauri/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

